[theme]
base = "dark"
primaryColor = "#d8a94b"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161c24"
textColor = "#e6edf3"
linkColor = "#d8a94b"
borderColor = "#242e3a"
dataframeBorderColor = "#242e3a"
dataframeHeaderBackgroundColor = "#141b23"
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
baseFontSize = 15
showWidgetBorder = true
headingFontWeights = [700, 700, 650]

[server]
headless = true

[browser]
gatherUsageStats = false
